function debounce(func, wait) {
  let timeout;
  return function executedFunction(...args) {
    const later = () => {
      clearTimeout(timeout);
      func(...args);
    };
    clearTimeout(timeout);
    timeout = setTimeout(later, wait);
  };
}

  const connectedEdges = new Set(network.getConnectedEdges(selectedNodeId));

  const nodeUpdates = allNodes.map(n => {
    const isConnected = connectedNodes.has(n.id);
    return {
      id: n.id,
      opacity: isConnected ? 1.0 : 0.15,
      font: { color: isConnected ? '#ffffff' : 'rgba(255,255,255,0.15)' }
    };
  });

  const edgeUpdates = allEdges.map(e => {
    const isConnected = connectedEdges.has(e.id);
    return {
      id: e.id,
      width: isConnected ? Math.max(e.width * 1.5, 2.5) : 1,
      color: isConnected 
        ? { color: '#58a6ff', opacity: 0.9 } 
        : { color: 'rgba(110, 118, 129, 0.1)' }
    };
  });

  nodesDS.update(nodeUpdates);
  edgesDS.update(edgeUpdates);
}

document.getElementById('reset-view-btn').addEventListener('click', () => {
  highlightConnections(null);
  network.moveTo({ scale: 0.85, animation: { duration: 500, easingFunction: 'easeInOutQuad' } });
});

document.getElementById('zoom-in-btn').addEventListener('click', () => {
  const scale = network.getScale();
  network.moveTo({ scale: scale * 1.3, animation: { duration: 300, easingFunction: 'easeInOutQuad' } });
});

document.getElementById('zoom-out-btn').addEventListener('click', () => {
  const scale = network.getScale();
  network.moveTo({ scale: scale / 1.3, animation: { duration: 300, easingFunction: 'easeInOutQuad' } });
});

let panModeActive = false;
document.getElementById('pan-btn').addEventListener('click', (e) => {
  panModeActive = !panModeActive;
  const btn = e.currentTarget;
  const canvas = document.querySelector('.vis-network canvas');
  if (panModeActive) {
    btn.style.color = '#58a6ff';
    btn.style.background = 'rgba(88, 166, 255, 0.1)';
    network.setOptions({ interaction: { dragNodes: false, dragView: true, zoomView: true } });
    if (canvas) canvas.style.cursor = 'grab';
  } else {
    btn.style.color = '';
    btn.style.background = '';
    network.setOptions({ interaction: { dragNodes: true, dragView: true, zoomView: true } });
    if (canvas) canvas.style.cursor = '';
  }
});

// Node Inspector UI Logic
function switchTab(tabId) {
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.tab === tabId);
  });
  document.querySelectorAll('.tab-pane').forEach(pane => {
    pane.classList.toggle('active', pane.id === tabId);
  });
}

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => switchTab(btn.dataset.tab));
});

function renderCallItem(item) {
  const nb = nodesDS.get(item.id);
  const color = nb ? (nb.color.background || nb.color) : '#484f58';
  const confClass = item.confidence === 'INFERRED' ? ' inferred' : '';
  const typeBadge = item.type ? `<span class="call-type">${esc(item.type)}</span>` : '';
  return `<div class="call-item${confClass}" style="border-left-color:${esc(color)}" data-nid="${esc(item.id)}">
    <span class="call-relation">${esc(item.relation)}</span>
    <span class="call-label">${esc(item.label)}</span>
    ${typeBadge}
  </div>`;
}

function showInfo(nodeId) {
  const emptyState = document.getElementById('inspector-empty');
  const detailsContent = document.getElementById('inspector-details');
  const indicator = document.getElementById('node-color-indicator');
  const titleEl = document.getElementById('inspector-title');

  if (!nodeId) {
    emptyState.classList.remove('hidden');
    detailsContent.classList.add('hidden');
    indicator.style.display = 'none';
    titleEl.textContent = 'Node Inspector';
    highlightConnections(null);
    return;
  }

  const n = nodesDS.get(nodeId);
  if (!n) return;

  expandSidebar('right');
  highlightConnections(nodeId);

  emptyState.classList.add('hidden');
  detailsContent.classList.remove('hidden');
  
  const bgCol = typeof n.color === 'string' ? n.color : (n.color.background || '#58a6ff');
  indicator.style.display = 'inline-block';
  indicator.style.backgroundColor = bgCol;
  indicator.style.color = bgCol;
  titleEl.textContent = n.label;

  // Set Metrics
  document.getElementById('metric-type').textContent = n.type || 'N/A';
  document.getElementById('metric-degree').textContent = n._degree || 0;
  const inCount = (n._neighbors_in || []).length;
  const outCount = (n._neighbors_out || []).length;
  document.getElementById('metric-conn').textContent = inCount + outCount;

  // Set Properties Tab
  const propTable = document.getElementById('props-body');
  propTable.innerHTML = `
    <tr><td class="prop-key">ID</td><td class="prop-val">${esc(n.id)}</td></tr>
    <tr><td class="prop-key">Label</td><td class="prop-val">${esc(n.label)}</td></tr>
    <tr><td class="prop-key">Type</td><td class="prop-val">${esc(n.type || 'N/A')}</td></tr>
    <tr><td class="prop-key">Community</td><td class="prop-val">${esc(n._community_name)}</td></tr>
    <tr><td class="prop-key">Source File</td><td class="prop-val">${esc(n._source_file || 'N/A')}</td></tr>
    <tr><td class="prop-key">File Type</td><td class="prop-val">${esc(n._file_type || 'N/A')}</td></tr>
  `;

  // Set Connections Tab
  const inboundHtml = (n._neighbors_in || []).map(renderCallItem).join('');
  const outboundHtml = (n._neighbors_out || []).map(renderCallItem).join('');
  
  document.getElementById('inbound-list').innerHTML = inboundHtml || '<div class="empty">No inbound links</div>';
  document.getElementById('outbound-list').innerHTML = outboundHtml || '<div class="empty">No outbound links</div>';
}

function filterConnections(query) {
  const q = query.toLowerCase();
  document.querySelectorAll('#tab-neighbors .call-item').forEach(el => {
    const text = el.textContent.toLowerCase();
    el.style.display = text.includes(q) ? 'flex' : 'none';
  });
}

function focusNode(nodeId) {
  if (!nodeId && activeSelectedNode) nodeId = activeSelectedNode;
  if (!nodeId) return;
  network.focus(nodeId, { scale: 1.4, animation: { duration: 500, easingFunction: 'easeInOutQuad' } });
  network.selectNodes([nodeId]);
  showInfo(nodeId);
}

function copyNodeMetadata() {
  if (!activeSelectedNode) return;
  const n = nodesDS.get(activeSelectedNode);
  if (n) {
    navigator.clipboard.writeText(JSON.stringify(n, null, 2));
    const copyBtn = document.getElementById('btn-copy');
    const origHtml = copyBtn.innerHTML;
    copyBtn.innerHTML = '<span>Copied!</span>';
    setTimeout(() => copyBtn.innerHTML = origHtml, 1500);
  }
}

document.addEventListener('click', e => {
  const el = e.target.closest('.call-item');
  if (el && el.dataset.nid !== undefined) focusNode(el.dataset.nid);
});

let hoveredNodeId = null;
network.on('hoverNode', params => {
  hoveredNodeId = params.node;
  container.style.cursor = 'pointer';
});
network.on('blurNode', () => {
  hoveredNodeId = null;
  container.style.cursor = 'default';
});

network.on('click', params => {
  if (params.nodes.length > 0) {
    showInfo(params.nodes[0]);
  } else if (hoveredNodeId === null) {
    showInfo(null);
  }
});

// Live Search Input
const searchInput = document.getElementById('search');
const searchResults = document.getElementById('search-results');

const handleSearch = debounce(() => {
  const q = searchInput.value.toLowerCase().trim();
  searchResults.innerHTML = '';
  if (!q) { searchResults.style.display = 'none'; return; }
  
  const matches = RAW_NODES.filter(n => n.label.toLowerCase().includes(q)).slice(0, 25);
  if (!matches.length) { searchResults.style.display = 'none'; return; }

  const frag = document.createDocumentFragment();
  matches.forEach(n => {
    const el = document.createElement('div');
    el.className = 'search-item';
    el.textContent = n.label;
    const bgCol = typeof n.color === 'string' ? n.color : (n.color.background || '#58a6ff');
    el.style.borderLeft = `3px solid ${bgCol}`;
    el.onclick = () => {
      focusNode(n.id);
      searchResults.style.display = 'none';
      searchInput.value = '';
    };
    frag.appendChild(el);
  });
  searchResults.appendChild(frag);
  searchResults.style.display = 'block';
}, 150);

searchInput.addEventListener('input', handleSearch);

// Global Keyboard Shortcuts (`/` to search, `Esc` to close)
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== searchInput) {
    e.preventDefault();
    searchInput.focus();
  } else if (e.key === 'Escape') {
    searchResults.style.display = 'none';
    highlightConnections(null);
  }
});

document.addEventListener('click', e => {
  if (!searchResults.contains(e.target) && e.target !== searchInput) searchResults.style.display = 'none';
});

// Community Filters
const hiddenCommunities = new Set();
const selectAllCb = document.getElementById('select-all-cb');

function updateSelectAllState() {
  const total = LEGEND.length;
  const hidden = hiddenCommunities.size;
  selectAllCb.checked = hidden === 0;
  selectAllCb.indeterminate = hidden > 0 && hidden < total;
}

function toggleAllCommunities(hide) {
  document.querySelectorAll('.legend-item').forEach(item => {
    hide ? item.classList.add('dimmed') : item.classList.remove('dimmed');
  });
  document.querySelectorAll('.legend-cb').forEach(cb => {
    cb.checked = !hide;
  });
  LEGEND.forEach(c => {
    if (hide) hiddenCommunities.add(c.cid); else hiddenCommunities.delete(c.cid);
  });
  applyNodeFilters();
  updateSelectAllState();
}

function invertCommunitySelection() {
  LEGEND.forEach(c => {
    const isHidden = hiddenCommunities.has(c.cid);
    const cb = document.querySelector(`.legend-cb[data-cid="${c.cid}"]`);
    const item = cb ? cb.closest('.legend-item') : null;

    if (isHidden) {
      hiddenCommunities.delete(c.cid);
      if (cb) cb.checked = true;
      if (item) item.classList.remove('dimmed');
    } else {
      hiddenCommunities.add(c.cid);
      if (cb) cb.checked = false;
      if (item) item.classList.add('dimmed');
    }
  });
  applyNodeFilters();
  updateSelectAllState();
}

function filterCommunities(query) {
  const q = query.toLowerCase();
  document.querySelectorAll('#legend .legend-item').forEach(el => {
    const label = el.querySelector('.legend-label').textContent.toLowerCase();
    el.style.display = label.includes(q) ? 'flex' : 'none';
  });
}

// Initialize Type Chips
const availableTypes = Array.from(new Set(RAW_NODES.map(n => n.type))).filter(Boolean);
const typeChipsContainer = document.getElementById('type-chips');

availableTypes.forEach(type => {
  const chip = document.createElement('div');
  chip.className = 'chip';
  chip.textContent = type;
  chip.onclick = () => {
    if (activeTypes.has(type)) {
      activeTypes.delete(type);
      chip.classList.remove('active');
    } else {
      activeTypes.add(type);
      chip.classList.add('active');
    }
    applyNodeFilters();
  };
  typeChipsContainer.appendChild(chip);
});

// Render Community Legend
const legendEl = document.getElementById('legend');
const legendFrag = document.createDocumentFragment();

LEGEND.forEach(c => {
  const item = document.createElement('div');
  item.className = 'legend-item';
  const cb = document.createElement('input');
  cb.type = 'checkbox';
  cb.className = 'legend-cb';
  cb.setAttribute('data-cid', c.cid);
  cb.checked = true;

  cb.addEventListener('change', (e) => {
    e.stopPropagation();
    if (cb.checked) {
      hiddenCommunities.delete(c.cid);
      item.classList.remove('dimmed');
    } else {
      hiddenCommunities.add(c.cid);
      item.classList.add('dimmed');
    }
    applyNodeFilters();
    updateSelectAllState();
  });

  item.innerHTML = `<div class="legend-dot" style="background:${c.color}; color:${c.color}"></div>
    <span class="legend-label">${c.label}</span>
    <span class="legend-count">${c.count}</span>`;
  item.prepend(cb);
  item.onclick = (e) => {
    if (e.target === cb) return;
    cb.checked = !cb.checked;
    cb.dispatchEvent(new Event('change'));
  };
  legendFrag.appendChild(item);
});
legendEl.appendChild(legendFrag);

function updateSidebarToggleTooltip(side, isCollapsed) {
  const btn = document.querySelector('[data-side="' + side + '"]');
  if (btn) btn.title = isCollapsed ? 'Expand sidebar' : 'Collapse sidebar';
}

function toggleSidebar(side) {
  const sidebar = document.getElementById(side === 'left' ? 'sidebar-left' : 'sidebar-right');
  const isCollapsed = sidebar.classList.toggle('collapsed');
  updateSidebarToggleTooltip(side, isCollapsed);
  setTimeout(() => network.redraw(), 300);
}

function expandSidebar(side) {
  const sidebar = document.getElementById(side === 'left' ? 'sidebar-left' : 'sidebar-right');
  if (!sidebar.classList.contains('collapsed')) return;
  sidebar.classList.remove('collapsed');
  updateSidebarToggleTooltip(side, false);
  setTimeout(() => network.redraw(), 300);
}

function initSidebars() {
  ['left', 'right'].forEach(side => {
    const sidebar = document.getElementById(side === 'left' ? 'sidebar-left' : 'sidebar-right');
    const isCollapsed = sidebar.classList.contains('collapsed');
    updateSidebarToggleTooltip(side, isCollapsed);
  });
}

network.once('stabilizationIterationsDone', () => {
  initSidebars();
  
  // Make sure physics is running to get the real gravity effect
  network.setOptions({ physics: { enabled: true } });
  
  // Capture positions and slightly perturb them to trigger spring/gravity forces
  const origPositions = network.getPositions();
  const updates = Object.keys(origPositions).map(id => {
    const orig = origPositions[id];
    return {
      id: id,
      // Random displacement between -100 and +100 to trigger a massive gravity bounce
      x: orig.x + (Math.random() - 0.5) * 200,
      y: orig.y + (Math.random() - 0.5) * 200
    };
  });
  
  // Apply the displacement; physics engine will naturally pull them back
  nodesDS.update(updates);
  network.startSimulation();

  // Start zoomed in even more
  network.moveTo({ scale: 4.0, position: { x: 0, y: 0 } });

  // Smooth zoom out plays while nodes bounce back via gravity
  network.moveTo({
    position: { x: 0, y: 0 },
    scale: 0.5,
    animation: { duration: 1500, easingFunction: 'easeOutQuad' }
  });

  // After 1.55s, everything freezes completely
  setTimeout(() => {
    network.setOptions({ physics: { enabled: false } });
    network.stopSimulation();
  }, 1550);
});
</script>
<script>
const hyperedges = [];
network.on('afterDrawing', function(ctx) {
    hyperedges.forEach(h => {
        const positions = h.nodes
            .map(nid => network.getPositions([nid])[nid])
            .filter(p => p !== undefined);
        if (positions.length < 2) return;
        ctx.save();
        ctx.globalAlpha = 0.12;
        ctx.fillStyle = '#8b5cf6';
        ctx.strokeStyle = '#a78bfa';
        ctx.lineWidth = 2;
        ctx.setLineDash([6, 4]);
        ctx.beginPath();
        const cx = positions.reduce((s, p) => s + p.x, 0) / positions.length;
        const cy = positions.reduce((s, p) => s + p.y, 0) / positions.length;
        const expanded = positions.map(p => ({
            x: cx + (p.x - cx) * 1.25,
            y: cy + (p.y - cy) * 1.25
        }));
        ctx.moveTo(expanded[0].x, expanded[0].y);
        expanded.slice(1).forEach(p => ctx.lineTo(p.x, p.y));
        ctx.closePath();
        ctx.fill();
        ctx.globalAlpha = 0.45;
        ctx.stroke();
        
        ctx.globalAlpha = 0.85;
        ctx.fillStyle = '#c4b5fd';
        ctx.font = '600 11px -apple-system, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(h.label, cx, cy - 6);
        ctx.restore();
    });
});
</script>
